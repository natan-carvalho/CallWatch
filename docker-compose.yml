version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n
      POSTGRES_DB: n8n
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  waha:
    image: devlikeapro/waha:latest
    container_name: waha
    restart: always
    environment:
      WAHA_API_KEY: 8c67ad64270645abb462b335192ff808
      WAHA_LICENSE: free
      WAHA_REDIS_URI: redis://redis:6379
      WAHA_LOG_LEVEL: info
      WAHA_DATA: /data
    ports:
      - "3000:3000"
    volumes:
      - waha_data:/data
    depends_on:
      - redis

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin
      - N8N_ENCRYPTION_KEY=chave-secreta-bem-grande
      - N8N_PORT=5678
      - WEBHOOK_URL=http://localhost:5678/
      - EXECUTIONS_PROCESS=main
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres
      - redis
      - waha

volumes:
  postgres_data:
  redis_data:
  waha_data:
  n8n_data:
